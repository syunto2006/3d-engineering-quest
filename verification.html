<!doctype html><html lang="ja"><meta charset="utf-8"><title>教材の実行検証</title><body><h1>80課題の解答例を実行検証</h1><button id="start">検証開始</button><p id="status">待機中</p><pre id="results"></pre><iframe id="frame" sandbox="allow-scripts allow-downloads" style="width:900px;height:700px"></iframe><script type="module">
import {lessons} from './curriculum.js?v=9';import {runProject} from './runner.js?v=4';
const files=await fetch('base.json?v=9').then(r=>r.json()),results=document.querySelector('#results'),frame=document.querySelector('#frame');let active=0,resolve;
addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.data.scope!=='quest-runner'||e.data.run!==active)return;if(e.data.type==='result')resolve?.(e.data)});
document.querySelector('#start').onclick=async()=>{document.querySelector('#start').disabled=true;let passed=0;const startId=Number(new URLSearchParams(location.search).get('start')||0);for(const l of lessons){files[l.file]=l.mode==='replace'?l.solution:(files[l.file]||'')+'\n'+l.solution;if(l.id<startId)continue;active=l.id+1;document.querySelector('#status').textContent='実行中 '+active+'/'+lessons.length;const outcome=await new Promise(r=>{let timeout=setTimeout(()=>r({ok:false,message:'timeout'}),20000);resolve=d=>{clearTimeout(timeout);r(d)};runProject(frame,{...files},l.test,active)});if(outcome.ok)passed++;results.textContent+=(outcome.ok?'PASS ':'FAIL ')+(l.id+1)+' '+l.title+' '+(outcome.message||'')+'\n'}document.querySelector('#status').textContent='完了 '+passed+'/'+(lessons.length-startId);document.querySelector('#start').disabled=false};
</script></body></html>
