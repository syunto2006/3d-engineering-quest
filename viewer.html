<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#0c1727;color:#e0eafa;font:14px sans-serif;overflow:hidden}canvas{display:block;width:100%;height:100%}#status{position:absolute;top:12px;left:16px;right:16px;pointer-events:none;color:#a5bed4}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><div id="status">3Dエンジンを読み込み中…</div><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
const status=document.querySelector('#status');
const exercise=new URLSearchParams(location.search).has('exercise');
let renderer,controls,mesh,material,spin=true,stlText='',currentRun=0;
const scene=new THREE.Scene();scene.background=new THREE.Color('#0c1727');
const camera=new THREE.PerspectiveCamera(40,1,0.1,1000);camera.position.set(220,170,240);
try{renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xc5eaff,0x38415c,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(100,200,150);scene.add(light);
const grid=new THREE.GridHelper(400,20,0x35516b,0x192e43);grid.position.y=-64;scene.add(grid);
const internals=new THREE.Group();for(const y of [-30,0,30]){const board=new THREE.Mesh(new THREE.BoxGeometry(75,3,75),new THREE.MeshStandardMaterial({color:0x6bcb73,roughness:.6}));board.position.y=y;internals.add(board)}scene.add(internals);
const geometry=new THREE.BoxGeometry(100,100,100);material=new THREE.MeshStandardMaterial({color:'#55c6d9',roughness:.38,metalness:.45});mesh=new THREE.Mesh(geometry,material);scene.add(mesh);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
let last=performance.now();renderer.setAnimationLoop(t=>{const dt=Math.min((t-last)/1000,.05);last=t;if(spin)mesh.rotation.y+=dt*.25;controls.update();renderer.render(scene,camera)});
status.textContent='ドラッグで回転 / ホイールで拡大';
parent.postMessage({type:'ready'},'*');
if(!exercise){fetch('cubesat.stl').then(r=>{if(!r.ok)throw Error('STLファイルが見つかりません');return r.text()}).then(text=>{stlText=text;const g=new STLLoader().parse(text);g.center();mesh.geometry.dispose();mesh.geometry=g;parent.postMessage({type:'labReady'},'*')}).catch(e=>{status.textContent=e.message;parent.postMessage({type:'labError',message:e.message},'*')})}
addEventListener('message',async e=>{if(e.source!==parent)return;const d=e.data;if(d.type==='settings'){material.transparent=d.opacity<1;material.opacity=d.opacity;material.depthWrite=d.opacity===1;material.color.set(d.color);material.wireframe=d.wire;material.needsUpdate=true;spin=d.spin;if(d.reset){mesh.rotation.set(0,0,0);camera.position.set(220,170,240);controls.target.set(0,0,0);controls.update()}}
if(d.type==='run'&&exercise){const id=++currentRun;stlText=d.stl;spin=false;mesh.rotation.set(0,0,0);mesh.position.set(0,0,0);mesh.scale.set(1,1,1);material.color.set('#55c6d9');material.opacity=1;material.transparent=false;material.wireframe=false;material.depthWrite=true;const loader=new STLLoader();let loaded=false;const loadSTL=async()=>{const g=loader.parse(stlText);g.center();mesh.geometry.dispose();mesh.geometry=g;loaded=true;return g};const button=new EventTarget();let clicked=false;button.addEventListener('click',()=>{clicked=true});try{
const fn=new (Object.getPrototypeOf(async function(){}).constructor)('THREE','scene','mesh','material','loadSTL','button',d.code);await fn(THREE,scene,mesh,material,loadSTL,button);button.dispatchEvent(new Event('click'));material.needsUpdate=true;
const color=material.color.getHexString();const tests={mesh:scene.children.includes(mesh)&&mesh.visible&&mesh.scale.x===1.5,color:color==='ff9933',opacity:material.transparent===true&&Math.abs(material.opacity-.35)<.001,rotate:Math.abs(mesh.rotation.y-Math.PI/2)<.001,load:loaded,event:clicked&&material.wireframe===true,final:loaded&&material.transparent===true&&Math.abs(material.opacity-.35)<.001&&color==='ff9933'&&Math.abs(mesh.rotation.y-Math.PI/2)<.001};if(id===currentRun)parent.postMessage({type:'result',run:d.run,ok:tests[d.test]===true,details:{color,opacity:material.opacity,transparent:material.transparent,rotation:mesh.rotation.y,loaded,wireframe:material.wireframe,scale:mesh.scale.x}},'*');
}catch(err){parent.postMessage({type:'result',run:d.run,ok:false,error:err.message},'*')}}});
}catch(e){status.textContent='3Dを開始できません。WebGL対応ブラウザとネット接続を確認してください。';parent.postMessage({type:'labError',message:e.message},'*')}
</script><script>setTimeout(()=>{if(!document.querySelector('canvas')){document.querySelector('#status').textContent='3Dの読み込みに失敗しました。ネット接続・CDNへのアクセス・WebGLを確認して再読み込みしてください。';parent.postMessage({type:'labError',message:'Three.jsを読み込めませんでした'},'*')}},15000)</script></body></html>
